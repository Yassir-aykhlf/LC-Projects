[project]
name = "slotwise"
version = "0.1.0"
# The sandbox image is Debian bookworm based, so `python3` is 3.11.
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.12.5",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[dependency-groups]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "behavior(name): visible behavior group",
  "postgres: requires the candidate-visible PostgreSQL runner",
]
